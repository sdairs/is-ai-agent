name: Harness integration tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Rust and test-runner checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Check Rust
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --all-targets -- -D warnings
          cargo doc --no-deps
      - name: Check evidence verifiers and gateway
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests/harnesses -p 'test_*.py'

  harness:
    name: ${{ matrix.harness }} / Linux ${{ matrix.expected_gap && '(known detection gap)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        harness: [pi, qwen-code, opencode, github-copilot, crush, codex, claude-code, gemini-cli]
        include:
          - harness: goose
            expected_gap: true
          - harness: cline
            expected_gap: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Run real CLI against scripted provider
        # No secrets, private configuration, provider login, or live inference.
        run: python3 tests/harnesses/run.py --harness '${{ matrix.harness }}' --mode mock --discover ${{ matrix.expected_gap && '--expect-undetected' || '' }}
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-${{ matrix.harness }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/harness-runs/${{ matrix.harness }}/**/*.json
          if-no-files-found: warn
          retention-days: 14
